<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="description" content="M.Tech Geoinformatics, NIT Warangal. SAR, hyperspectral and DEM analysis. Open to Geospatial and GIS Analyst roles."><title>Gallery | Nyshadham Sai Karthikeya</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg id="scene" aria-hidden="true" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 800"></svg>
<header><nav aria-label="Main"><b><a href="index.html" style="text-decoration:none">N. Sai Karthikeya</a></b><a href="index.html">Home</a><a href="about.html">About</a><a href="experience.html">Experience</a><a href="projects.html">Projects</a><a href="skills.html">Skills</a><a href="awards.html">Awards</a><a href="gallery.html" aria-current="page">Gallery</a><a href="contact.html">Contact</a></nav></header>
<main>
<section id="gallery">
<h2>Gallery</h2>
<p class="gnote" id="gnote" hidden>Photos coming soon.</p>
<div class="gallery" id="gallery-grid"></div>
</section>
</main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
<button class="lbx" id="lb-close" aria-label="Close">&times;</button>
<button class="lbn prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
<figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
<button class="lbn next" id="lb-next" aria-label="Next photo">&#8250;</button>
</div>
<footer>© 2026 Nyshadham Sai Karthikeya. M.Tech Geoinformatics, NIT Warangal. Based in Telangana, India.</footer>
<script src="scene.js"></script>
<script>
/* Add your photos to the repo, then list them here: ['file name', 'caption'] */
var PHOTOS=[
['gallery-1.jpg','Add a caption'],
['gallery-2.jpg','Add a caption'],
['gallery-3.jpg','Add a caption'],
['gallery-4.jpg','Add a caption'],
['gallery-5.jpg','Add a caption'],
['gallery-6.jpg','Add a caption']
];
(function(){
var grid=document.getElementById('gallery-grid'),lb=document.getElementById('lb'),li=document.getElementById('lb-img'),lc=document.getElementById('lb-cap'),shown=[],cur=0,opener=null;
PHOTOS.forEach(function(p){
 var t=new Image();
 t.onload=function(){
  var b=document.createElement('button'),im=new Image();b.type='button';
  im.src=p[0];im.alt=p[1];im.loading='lazy';im.decoding='async';
  b.appendChild(im);grid.appendChild(b);shown.push({src:p[0],cap:p[1],btn:b});
  b.onclick=function(){open(shown.findIndex(function(x){return x.btn===b}),b)};
 };
 t.src=p[0];
});
setTimeout(function(){if(!shown.length)document.getElementById('gnote').hidden=false},1500);
function show(i){cur=(i+shown.length)%shown.length;li.src=shown[cur].src;li.alt=shown[cur].cap;lc.textContent=shown[cur].cap}
function open(i,b){opener=b;show(i);lb.hidden=false;document.body.style.overflow='hidden';document.getElementById('lb-close').focus()}
function close(){lb.hidden=true;document.body.style.overflow='';if(opener)opener.focus()}
document.getElementById('lb-close').onclick=close;
document.getElementById('lb-prev').onclick=function(){show(cur-1)};
document.getElementById('lb-next').onclick=function(){show(cur+1)};
lb.addEventListener('click',function(e){if(e.target===lb)close()});
document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
})();
</script>
</body></html>
